services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-algodoal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algodoal}
      POSTGRES_DB: ${POSTGRES_DB:-algodoal}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algodoal} -d ${POSTGRES_DB:-algodoal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      # Só leitura, para o teste de consistência da bbox (backend/tests/test_area_do_mapa.py)
      # rodar também aqui no container. Só serve para rodar localmente: no CI o pytest roda
      # direto no runner, com o checkout inteiro. Mesmos caminhos relativos à raiz do
      # repositório. Sai quando a bbox tiver fonte única (#50).
      - ./frontend/src/lib:/frontend/src/lib:ro
      - ./scripts:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
